name: Mushaf-Prüfung

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uthmani-Text (Hafs) laden
        run: npm pack quran-json@3.1.2 && tar xzf quran-json-3.1.2.tgz
      - name: Alle Verse mit dem Mushaf abgleichen
        run: python3 tools/check_quran.py package/dist/quran.json
